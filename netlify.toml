[build]
  # Drop a restored Next cache before compiling. Production publishes were
# Republish after the Diwali production deploy was skipped before the build started.
  # failing with no log while the same tree built on deploy previews.
  command = "npm cache clean --force && rm -rf .next node_modules/.cache && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "mysql://placeholder:placeholder@127.0.0.1:3306/placeholder"
  NEXT_PUBLIC_API_BASE_URL = ""
  NEXTAUTH_SECRET = "netlify-build-placeholder-change-in-dashboard"
  NEXTAUTH_URL = "http://localhost:3000"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Do not 301 /path/ to /path in this file. Netlify matches both forms to the
# same rule, so the redirect loops. Next.js canonicalizes the trailing slash.
[build.processing.html]
  pretty_urls = false
